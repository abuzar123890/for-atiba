<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For Aiman ❤️</title>
  <style>
    body {
      margin: 0;
      background: #0d0d12;
      font-family: Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      color: #ff3366;
      font-size: 2rem;
      margin-bottom: 10px;
      text-shadow: 0 0 15px #ff3366;
    }
    p { color: #ffb6c1; margin-bottom: 30px; }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 300px;
    }
    .btn {
      background: rgba(255, 51, 102, 0.15);
      border: 2px solid #ff3366;
      color: #fff;
      padding: 15px 20px;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
      transition: 0.2s;
    }
    .btn:active { transform: scale(0.95); background: #ff3366; }
  </style>
</head>
<body>
  <h1>For Aiman ❤️</h1>
  <p>Pick a surprise to open ✨</p>

  <div class="btn-container">
    <a href="heart.html" class="btn">💖 Rotating Heart</a>
    <a href="python_heart.html" class="btn">✨ Special Heart</a>
    <a href="proposal.html" class="btn">🎁 Surprise</a>
  </div>
</body>
</html>
